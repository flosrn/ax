# The merge ground. `ax pr gate` refuses a repository that declares no expected
# check ("an undeclared repository is not a repository with nothing left to
# check"), and until this file existed that was literally true here: the package
# that ships the gate had no CI of its own, so its own pull requests could only
# be merged by going around it.
#
# UNCONDITIONAL ON ALL THREE AXES, on purpose (F-014). No `if:`, no `paths:` or
# `paths-ignore:`, and no branch filter on `pull_request`. An enumerated gate
# check that can legitimately skip makes `ax pr gate` refuse every future pull
# request that does not touch the filtered path — forever, on a job that
# correctly did not run. The job is cheap enough that always running it costs
# less than that failure mode.
#
# The exact check-run name this produces is what `prGate.checks` in
# ax.config.json enumerates, matched by string equality on the head SHA. Change
# the job name here and that file has to change in the same commit.
name: Test

# `workflow_dispatch` is not a convenience. GitHub creates NO workflow run for an
# event triggered by `GITHUB_TOKEN` (anti-recursion), so a release-please pull
# request — whose head is pushed by github-actions[bot] — gets zero check-runs,
# and `prGate.checks` then refuses it forever on a check that structurally
# cannot run. Measured on #18 at 2ffb48fbab1e: the workflow file was present on
# that branch and no run existed. A manual dispatch is attributed to the caller
# rather than to the token, which is what makes the ground reachable there:
#
#   gh workflow run test.yml --ref <release-please branch>
#
# Enumerating a check the CI cannot produce on a whole class of pull requests is
# the same trap as enumerating one that can skip (F-014), reached from the other
# side. This trigger is what keeps the release path gateable instead of
# permanently hand-merged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Both suites in one job: `pnpm test` is `test:node && test:omp`, and the
    # gate wants one name to enumerate rather than a set that changes shape.
    name: pnpm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # test:omp is `bun test omp` — the OMP bundle is TypeScript run by Bun,
      # so this is not optional tooling.
      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
