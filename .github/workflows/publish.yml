# Release Please owns the version, changelog, v-tag and GitHub Release. npm
# publishing is a second, retryable job: creating a release and uploading its
# tarball are two different external mutations, so a registry outage must not
# require minting another release.
#
# npm authentication is Trusted Publishing (OIDC). The first package version is
# the only manual bootstrap because npm cannot configure a trusted publisher for
# a package that does not exist. Until that is done, leave the repository variable
# NPM_TRUSTED_PUBLISHING_READY unset: releases stay green and print the bootstrap.
# Trusted publisher: owner flosrn, repository ax, workflow publish.yml.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z GitHub Release whose failed npm publish should be retried
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Explain the one-time npm bootstrap
        if: ${{ steps.release.outputs.release_created == 'true' && vars.NPM_TRUSTED_PUBLISHING_READY != 'true' }}
        run: |
          {
            echo "## ${{ steps.release.outputs.tag_name }} tagged, not published"
            echo
            echo "npm was skipped because NPM_TRUSTED_PUBLISHING_READY is not true. Once:"
            echo "1. Check out this exact tag and run npm publish locally with the account OTP."
            echo "2. Configure @flosrn/ax Trusted Publisher for flosrn/ax, workflow publish.yml."
            echo "3. Set the repository variable NPM_TRUSTED_PUBLISHING_READY to true."
            echo "Future releases publish automatically; workflow_dispatch retries this tag."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: release
    if: >-
      ${{
        always() &&
        vars.NPM_TRUSTED_PUBLISHING_READY == 'true' &&
        (
          (github.event_name == 'push' && needs.release.outputs.release_created == 'true') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be shaped vX.Y.Z, got: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          VERSION="${RELEASE_TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "tag $RELEASE_TAG contains package version $ACTUAL" >&2
            exit 1
          fi

      # Node 22 carries Corepack. Enable only pnpm: a Corepack npm shim refuses
      # to run inside a project whose packageManager is pnpm.
      - run: |
          corepack enable pnpm
          corepack install
      - run: pnpm install --frozen-lockfile
      # Pinned: the publisher itself is part of the release input.
      - run: npm install --global npm@12.0.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm test
      - run: npm pack --dry-run

      - id: registry
        name: Decide whether npm still needs this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          set +e
          OUTPUT="$(npm view "@flosrn/ax@$VERSION" version --json 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@flosrn/ax@$VERSION is already on npm; retry is complete."
          elif [[ "$OUTPUT" == *"E404"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$OUTPUT" >&2
            exit "$STATUS"
          fi

      - if: ${{ steps.registry.outputs.publish == 'true' }}
        run: npm publish

  # Tell every consuming repository that a version it can install now exists.
  #
  # WHY THIS EXISTS. The pin is the version authority (`src/delegation.mjs`), so a
  # fix released here does not reach a consumer until that consumer's pin moves.
  # Dependabot moves it, but on a `daily` schedule — and a scheduled poll is not
  # what "propagate on release" means: measured 2026-08-28, five releases shipped
  # while every bump was still made by hand. This job is the event half. The
  # consumer's own workflow does the bump, validates it, and pushes; nothing here
  # touches its tree, so ax never needs to know how a consumer builds.
  #
  # AFTER `publish`, NEVER BESIDE IT. A consumer told about a version npm does not
  # serve yet installs nothing and fails, so this waits for the publish job's own
  # success rather than the release's. A skipped publish (bootstrap not done, or a
  # release-please run that created no release) means no notification.
  #
  # FAILS OPEN, ON PURPOSE. The token and the consumer list are operational
  # config, not release inputs: a missing one prints what is missing and exits 0.
  # A release that already tagged and published must not report red because a
  # downstream courtesy could not run — the pin still moves on Dependabot's daily
  # pass, which is exactly the floor this job improves on.
  #
  # THE LIST IS A VARIABLE, NOT CODE. `gh variable set AX_CONSUMERS --body
  # '["goodluckagency/ofmchat"]'` — adding a consumer is an operational act and
  # must not require a release of this package to take effect.
  notify-consumers:
    needs: [release, publish]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag_name }}
      CONSUMERS: ${{ vars.AX_CONSUMERS }}
      GH_TOKEN: ${{ secrets.AX_CONSUMER_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch ax-release to every consumer
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice title=No dispatch token::AX_CONSUMER_DISPATCH_TOKEN is unset, so $VERSION was not announced. Consumers still pick it up on their own Dependabot pass."
            exit 0
          fi
          if [ -z "${CONSUMERS:-}" ]; then
            echo "::notice title=No consumers declared::Set the AX_CONSUMERS repository variable to a JSON array of owner/repo to announce releases."
            exit 0
          fi

          # One failing consumer must not hide the others: each is attempted, and
          # the summary names every outcome. A 404 here is almost always the token
          # missing that repository rather than the repository missing.
          failed=0
          for repo in $(printf '%s' "$CONSUMERS" | jq -r '.[]'); do
            if gh api "repos/$repo/dispatches" \
                 -f event_type=ax-release \
                 -f "client_payload[version]=$VERSION" \
                 -f "client_payload[tag]=$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::notice title=Announced::$repo told about $VERSION"
            else
              echo "::warning title=Not announced::$repo refused the dispatch — check AX_CONSUMER_DISPATCH_TOKEN has Contents:write on it"
              failed=$((failed + 1))
            fi
          done
          echo "announced $VERSION to $(printf '%s' "$CONSUMERS" | jq -r 'length') consumer(s), $failed refused" >> "$GITHUB_STEP_SUMMARY"
