# Publish to npm without a token.
#
# The account runs 2FA in `auth-and-writes` mode, so a local `npm publish`
# demands a one-time password every time, and the tokens that used to bypass
# that are being restricted (npm says so during login:
# https://gh.io/npm-gat-bypass2fa-deprecation). OIDC trusted publishing is the
# path npm points at instead: GitHub signs a short-lived identity for this
# workflow, npm verifies it, and no secret exists to leak or rotate.
#
# `id-token: write` is what mints that identity. Without it the publish falls
# back to looking for a token and fails.
# Dispatch-only on purpose. npm cannot accept an OIDC publish until a trusted
# publisher is declared for the package, and a package must already EXIST to
# have that setting — so the first publish needs one credential, once, by hand.
# Firing on every `v*` tag before then would just paint the tag history red.
# Measured 2026-08-21 (run 32455245327): the identity is minted, the provenance
# is signed and logged to Sigstore, and the PUT returns 404 "or you do not have
# permission" — the signature works, the authorisation is missing.
name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5+; setup-node still ships npm 10.
      - run: npm install -g npm@latest

      - run: node --test "tests/*.test.mjs"

      - run: npm publish --provenance --access public
